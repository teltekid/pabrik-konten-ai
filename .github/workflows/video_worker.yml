name: Video Worker

on:
  repository_dispatch:
    types: [generate_video_job]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (kosongkan untuk ambil pending terlama)'
        required: false
        default: ''

concurrency:
  group: video-generator-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          TARGET_JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
        run: python worker/src/main.py